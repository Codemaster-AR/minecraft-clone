<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Clone - Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M9 0h2v20H9zM0 9h20v2H0z" fill="rgba(255,255,255,0.8)"/></svg>') no-repeat center;
            transform: translate(-50%, -50%); pointer-events: none; mix-blend-mode: difference; z-index: 10;
        }
        #ui-container { position: absolute; bottom: 0; width: 100%; pointer-events: none; }
        #hotbar {
            display: flex; justify-content: center; background: rgba(0,0,0,0.5); padding: 5px; gap: 5px;
            pointer-events: auto; width: fit-content; margin: 0 auto 10px auto; border-radius: 5px;
        }
        .slot {
            width: 40px; height: 40px; background: rgba(100,100,100,0.8); border: 2px solid #333;
            display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative;
        }
        .slot.active { border-color: white; box-shadow: 0 0 5px white; }
        .slot img { width: 32px; height: 32px; image-rendering: pixelated; }
        .count { position: absolute; bottom: 2px; right: 2px; color: white; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 0 #000; }
        
        #inventory-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 20; justify-content: center; align-items: center;
            flex-direction: column; color: white;
        }
        #inventory-window {
            background: #c6c6c6; padding: 20px; border: 4px solid #555; color: #333;
            display: flex; gap: 20px; image-rendering: pixelated;
        }
        .grid-container { display: grid; gap: 4px; background: #8b8b8b; padding: 4px; border: 2px solid #fff; border-right-color: #373737; border-bottom-color: #373737; }
        .crafting-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .crafting-arrow { font-size: 24px; font-weight: bold; color: #333; }
        
        #debug { position: absolute; top: 10px; left: 10px; color: white; font-weight: bold; text-shadow: 1px 1px 0 #000; pointer-events: none; }
        #stats { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); color: white; display: flex; gap: 10px; pointer-events: none; }
        .heart { color: #ff4d4d; font-size: 20px; }

        #mining-progress-container {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid #fff;
            display: none;
        }
        #mining-progress-bar { width: 0%; height: 100%; background: #fff; }
    </style>
</head>
<body>

<div id="debug">Survival Mode<br>L-Click: Mine/Attack | R-Click: Place<br>'E' Inventory | Space: Jump</div>
<div id="crosshair"></div>
<div id="mining-progress-container"><div id="mining-progress-bar"></div></div>

<div id="stats">
    <div id="health-row"></div>
</div>

<div id="inventory-screen">
    <h2>Inventory & Crafting</h2>
    <div id="inventory-window">
        <div>
            <h3>Backpack</h3>
            <div id="main-inventory" class="grid-container" style="grid-template-columns: repeat(9, 1fr);"></div>
        </div>
        <div class="crafting-section">
            <h3 id="crafting-title">Crafting</h3>
            <div id="crafting-grid" class="grid-container"></div>
            <div class="crafting-arrow">➜</div>
            <div id="crafting-result" class="slot" style="background: #8b8b8b;"></div>
        </div>
    </div>
    <div style="margin-top: 20px; color: #ccc;">Press 'E' to Close</div>
</div>

<div id="ui-container">
    <div id="hotbar"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/**
 * 1. TEXTURES & ITEMS
 */
const TextureGen = {
    cache: {},
    create(name, color, noiseAlpha = 0.1, details = []) {
        if (this.cache[name]) return this.cache[name];
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 64, 64);
        for(let i=0; i<400; i++) {
            ctx.fillStyle = `rgba(0,0,0,${Math.random() * noiseAlpha})`;
            ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
            ctx.fillStyle = `rgba(255,255,255,${Math.random() * noiseAlpha})`;
            ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
        }
        details.forEach(d => {
            ctx.fillStyle = d.color;
            if(d.type === 'rect') ctx.fillRect(d.x, d.y, d.w, d.h);
            if(d.type === 'spots') {
                for(let i=0; i<d.count; i++) ctx.fillRect(Math.random()*60, Math.random()*60, d.s, d.s);
            }
        });
        const url = canvas.toDataURL();
        this.cache[name] = url;
        return url;
    }
};

const TEX = {
    grass_top: TextureGen.create('grass_top', '#5cb85c', 0.1, [{type:'spots', count:50, s:2, color:'#4cae4c'}]),
    grass_side: TextureGen.create('grass_side', '#795548', 0.1, [{type:'rect', x:0, y:0, w:64, h:20, color:'#5cb85c'}]),
    dirt: TextureGen.create('dirt', '#795548', 0.15),
    stone: TextureGen.create('stone', '#757575', 0.1),
    wood: TextureGen.create('wood', '#5d4037', 0.1, [{type:'rect', x:10, y:0, w:10, h:64, color:'#4e342e'}, {type:'rect', x:40, y:0, w:10, h:64, color:'#4e342e'}]),
    leaves: TextureGen.create('leaves', '#388e3c', 0.2, [{type:'spots', count:100, s:4, color:'#2e7d32'}]),
    plank: TextureGen.create('plank', '#a1887f', 0.05, [{type:'rect', x:0, y:0, w:64, h:2, color:'#5d4037'}, {type:'rect', x:0, y:32, w:64, h:2, color:'#5d4037'}]),
    cobblestone: TextureGen.create('cobblestone', '#616161', 0.2, [{type:'rect', x:10, y:10, w:20, h:20, color:'#757575'}, {type:'rect', x:35, y:35, w:15, h:15, color:'#757575'}]),
    crafting_table_side: TextureGen.create('crafting_side', '#5d4037', 0.05, [{type:'rect', x:5, y:5, w:54, h:54, color:'#8d6e63'}]),
    crafting_table_top: TextureGen.create('crafting_top', '#a1887f', 0.05, [{type:'rect', x:10, y:10, w:44, h:44, color:'#5d4037'}]),
    pig: TextureGen.create('pig', '#f48fb1', 0.05),
    zombie: TextureGen.create('zombie', '#2e7d32', 0.1),
    bedrock: TextureGen.create('bedrock', '#212121', 0.3)
};

const BLOCK = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, WOOD: 4, LEAVES: 5, PLANKS: 6, COBBLE: 7, CRAFTING_TABLE: 8, BEDROCK: 99 };

const ITEMS = {
    [BLOCK.GRASS]: { name: "Grass Block", texture: TEX.grass_side, type: 'block', hardness: 0.6 },
    [BLOCK.DIRT]: { name: "Dirt", texture: TEX.dirt, type: 'block', hardness: 0.5 },
    [BLOCK.STONE]: { name: "Stone", texture: TEX.stone, type: 'block', hardness: 1.5, tool: 'pickaxe', drop: BLOCK.COBBLE },
    [BLOCK.WOOD]: { name: "Log", texture: TEX.wood, type: 'block', hardness: 2.0 },
    [BLOCK.LEAVES]: { name: "Leaves", texture: TEX.leaves, type: 'block', hardness: 0.2 },
    [BLOCK.PLANKS]: { name: "Planks", texture: TEX.plank, type: 'block', hardness: 2.0 },
    [BLOCK.COBBLE]: { name: "Cobblestone", texture: TEX.cobblestone, type: 'block', hardness: 2.0, tool: 'pickaxe' },
    [BLOCK.CRAFTING_TABLE]: { name: "Crafting Table", texture: TEX.crafting_table_side, type: 'block', hardness: 2.5 },
    [BLOCK.BEDROCK]: { name: "Bedrock", texture: TEX.bedrock, type: 'block', hardness: Infinity },
    100: { name: "Stick", texture: TextureGen.create('stick', '#8d6e63', 0, [{type:'rect', x:28, y:10, w:8, h:44, color:'#5d4037'}]), type: 'item' },
    101: { name: "Wooden Pickaxe", texture: TextureGen.create('wood_pick', 'rgba(0,0,0,0)', 0, [{type:'rect', x:30, y:30, w:6, h:30, color:'#8d6e63'}, {type:'rect', x:10, y:20, w:44, h:10, color:'#a1887f'}]), type: 'tool', toolType: 'pickaxe', efficiency: 2.5 }
};

const RECIPES = [
    { in: [BLOCK.WOOD], out: { id: BLOCK.PLANKS, count: 4 } },
    { in: [BLOCK.PLANKS, null, BLOCK.PLANKS, null], out: { id: 100, count: 4 } },
    { in: [BLOCK.PLANKS, BLOCK.PLANKS, BLOCK.PLANKS, BLOCK.PLANKS], out: { id: BLOCK.CRAFTING_TABLE, count: 1 } },
    { in: [BLOCK.PLANKS, BLOCK.PLANKS, BLOCK.PLANKS, null, 100, null, null, 100, null], out: { id: 101, count: 1 }, grid: 3 }
];

/**
 * 2. ENGINE SETUP
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ';
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(50, 100, 50);
scene.add(dirLight);

const loader = new THREE.TextureLoader();
const matCache = {};
function getMat(id) {
    if(matCache[id]) return matCache[id];
    const l = (url) => { const t = loader.load(url); t.magFilter = THREE.NearestFilter; return t; };
    let texs = (id === BLOCK.GRASS) ? [l(TEX.grass_side), l(TEX.grass_side), l(TEX.grass_top), l(TEX.dirt), l(TEX.grass_side), l(TEX.grass_side)] :
               (id === BLOCK.WOOD) ? [l(TEX.wood), l(TEX.wood), l(TEX.wood), l(TEX.wood), l(TEX.wood), l(TEX.wood)] :
               (id === BLOCK.CRAFTING_TABLE) ? [l(TEX.crafting_table_side), l(TEX.crafting_table_side), l(TEX.crafting_table_top), l(TEX.plank), l(TEX.crafting_table_side), l(TEX.crafting_table_side)] :
               [l(ITEMS[id].texture), l(ITEMS[id].texture), l(ITEMS[id].texture), l(ITEMS[id].texture), l(ITEMS[id].texture), l(ITEMS[id].texture)];
    const mat = texs.map(t => new THREE.MeshLambertMaterial({ map: t }));
    matCache[id] = mat; return mat;
}

const world = {};
const interactables = [];
function setBlock(x, y, z, id) {
    const key = `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
    if (world[key]) {
        const oldMesh = scene.getObjectByName(key);
        if (oldMesh) { scene.remove(oldMesh); interactables.splice(interactables.indexOf(oldMesh), 1); }
        delete world[key];
    }
    if (id === BLOCK.AIR) return;
    world[key] = id;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), getMat(id));
    mesh.position.set(Math.round(x), Math.round(y), Math.round(z));
    mesh.name = key;
    scene.add(mesh);
    interactables.push(mesh);
}

const droppedItems = [];
function spawnItemDrop(x, y, z, id) {
    const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
    const mat = getMat(id)[0];
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    droppedItems.push({ mesh, id, vel: new THREE.Vector3((Math.random()-0.5)*2, 4, (Math.random()-0.5)*2) });
}

function generateWorld() {
    for(let x = -15; x < 15; x++) {
        for(let z = -15; z < 15; z++) {
            let h = Math.floor(Math.sin(x/5) * 2 + Math.cos(z/5) * 2);
            setBlock(x, -5, z, BLOCK.BEDROCK);
            for(let y = -4; y < h; y++) setBlock(x, y, z, (y < h-2) ? BLOCK.STONE : BLOCK.DIRT);
            setBlock(x, h, z, BLOCK.GRASS);
            if(Math.random() < 0.03) {
                for(let ty = 1; ty <= 4; ty++) setBlock(x, h+ty, z, BLOCK.WOOD);
                for(let lx=-1; lx<=1; lx++) for(let lz=-1; lz<=1; lz++) setBlock(x+lx, h+5, z+lz, BLOCK.LEAVES);
            }
        }
    }
}
generateWorld();

/**
 * 3. PLAYER & COMBAT
 */
const player = {
    pos: new THREE.Vector3(0, 10, 0),
    vel: new THREE.Vector3(),
    onGround: false,
    health: 10,
    maxHealth: 10,
    invincible: 0,
    lastYVel: 0
};
camera.position.copy(player.pos);

function updateHealthUI() {
    const row = document.getElementById('health-row');
    row.innerHTML = '';
    for(let i=0; i<player.maxHealth; i++) {
        const s = document.createElement('span');
        s.className = 'heart';
        s.innerHTML = i < player.health ? '❤' : '♡';
        row.appendChild(s);
    }
}
updateHealthUI();

function takeDamage(amt) {
    if(player.invincible > 0 || amt <= 0) return;
    player.health -= amt;
    player.invincible = 0.5;
    playSound('hit');
    updateHealthUI();
    if(player.health <= 0) {
        player.health = 10;
        player.pos.set(0, 15, 0);
        player.vel.set(0,0,0);
        updateHealthUI();
    }
}

/**
 * 4. MOBS
 */
const mobs = [];
const mobGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
const zombieMat = new THREE.MeshLambertMaterial({ map: loader.load(TEX.zombie) });
zombieMat.map.magFilter = THREE.NearestFilter;

class Zombie {
    constructor(x, z) {
        this.mesh = new THREE.Mesh(mobGeo, zombieMat);
        this.mesh.position.set(x, 10, z);
        scene.add(this.mesh);
        this.health = 4;
        this.vel = new THREE.Vector3();
    }
    update(dt) {
        const toPlayer = new THREE.Vector3().subVectors(player.pos, this.mesh.position);
        const dist = toPlayer.length();
        if(dist < 12) {
            toPlayer.y = 0; toPlayer.normalize();
            this.vel.x = toPlayer.x * 2.5;
            this.vel.z = toPlayer.z * 2.5;
            if(dist < 1.3) takeDamage(1);
        } else {
            this.vel.x *= 0.9; this.vel.z *= 0.9;
        }
        this.vel.y -= 20 * dt;
        this.mesh.position.addScaledVector(this.vel, dt);
        
        // Simple floor collision for mobs
        if(this.mesh.position.y < -4) { this.mesh.position.y = -4; this.vel.y = 0; }
    }
}
mobs.push(new Zombie(10, 10));

/**
 * 5. INPUT & MINING
 */
const keys = {};
let inventoryOpen = false;
let isCraftingTable = false;
let miningBlock = null;
let miningProgress = 0;

document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if(e.code === 'KeyE') toggleInventory();
    if(e.key >= '1' && e.key <= '9') selectedSlot = parseInt(e.key)-1, renderHotbar();
});
document.addEventListener('keyup', (e) => keys[e.code] = false);

document.body.addEventListener('mousedown', (e) => {
    if(!inventoryOpen) document.body.requestPointerLock();
    if(inventoryOpen) return;

    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    
    // Attack mobs?
    const mobIntersects = raycaster.intersectObjects(mobs.map(m => m.mesh));
    if(e.button === 0 && mobIntersects.length > 0 && mobIntersects[0].distance < 4) {
        const hitMob = mobs.find(m => m.mesh === mobIntersects[0].object);
        hitMob.health--;
        const push = new THREE.Vector3().subVectors(hitMob.mesh.position, player.pos).normalize().multiplyScalar(5);
        hitMob.vel.x = push.x; hitMob.vel.z = push.z; hitMob.vel.y = 3;
        playSound('hit');
        if(hitMob.health <= 0) {
            scene.remove(hitMob.mesh);
            mobs.splice(mobs.indexOf(hitMob), 1);
        }
        return;
    }

    const intersects = raycaster.intersectObjects(interactables);
    if (intersects.length > 0 && intersects[0].distance < 5) {
        const hit = intersects[0];
        if (e.button === 0) { // Start Mining
            miningBlock = hit.object;
            miningProgress = 0;
            document.getElementById('mining-progress-container').style.display = 'block';
        } else if (e.button === 2) { // Place / Interact
            const bx = hit.object.position.x, by = hit.object.position.y, bz = hit.object.position.z;
            if(world[`${bx},${by},${bz}`] === BLOCK.CRAFTING_TABLE && !keys['ShiftLeft']) {
                openCraftingTable();
            } else {
                const nx = hit.face.normal.x, ny = hit.face.normal.y, nz = hit.face.normal.z;
                const px = Math.round(bx + nx), py = Math.round(by + ny), pz = Math.round(bz + nz);
                const held = inventory[selectedSlot];
                if(held && held.id && ITEMS[held.id].type === 'block') {
                    setBlock(px, py, pz, held.id);
                    held.count--; if(held.count <= 0) held.id = null;
                    renderHotbar();
                    playSound('place');
                }
            }
        }
    }
});

document.body.addEventListener('mouseup', () => {
    miningBlock = null;
    document.getElementById('mining-progress-container').style.display = 'none';
});

/**
 * 6. INVENTORY & CRAFTING
 */
const inventory = new Array(36).fill(null).map(() => ({ id: null, count: 0 }));
let selectedSlot = 0;
const craftingGrid = new Array(9).fill(null);

function renderHotbar() {
    const el = document.getElementById('hotbar'); el.innerHTML = '';
    for(let i=0; i<9; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot' + (i === selectedSlot ? ' active' : '');
        const item = inventory[i];
        if(item && item.id) slot.innerHTML = `<img src="${ITEMS[item.id].texture}"><span class="count">${item.count}</span>`;
        el.appendChild(slot);
    }
}

function toggleInventory() {
    inventoryOpen = !inventoryOpen;
    document.getElementById('inventory-screen').style.display = inventoryOpen ? 'flex' : 'none';
    if(inventoryOpen) { document.exitPointerLock(); isCraftingTable = false; renderInventoryUI(); }
    else { document.body.requestPointerLock(); clearCraftingGrid(); }
}

function openCraftingTable() {
    inventoryOpen = true; isCraftingTable = true;
    document.getElementById('inventory-screen').style.display = 'flex';
    document.exitPointerLock(); renderInventoryUI();
}

function renderInventoryUI() {
    const mainInv = document.getElementById('main-inventory'); mainInv.innerHTML = '';
    inventory.forEach((item, idx) => {
        const d = createSlotDiv(item, idx, 'inv'); mainInv.appendChild(d);
    });
    const craftDiv = document.getElementById('crafting-grid');
    const size = isCraftingTable ? 3 : 2;
    craftDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    craftDiv.innerHTML = '';
    for(let i=0; i < size*size; i++) craftDiv.appendChild(createSlotDiv({ id: craftingGrid[i], count: craftingGrid[i] ? 1 : 0 }, i, 'craft'));
    checkRecipe();
}

function createSlotDiv(item, idx, type) {
    const s = document.createElement('div'); s.className = 'slot';
    if(item && item.id) s.innerHTML = `<img src="${ITEMS[item.id].texture}"><span class="count">${item.count}</span>`;
    s.onclick = () => {
        if(type === 'inv' && item.id) {
            const limit = isCraftingTable ? 9 : 4;
            for(let c=0; c<limit; c++) if(!craftingGrid[c]) { craftingGrid[c] = item.id; item.count--; if(item.count===0) item.id=null; break; }
        } else if (type === 'craft' && craftingGrid[idx]) {
            addToInventory(craftingGrid[idx], 1); craftingGrid[idx] = null;
        }
        renderInventoryUI(); renderHotbar();
    };
    return s;
}

function checkRecipe() {
    const size = isCraftingTable ? 3 : 2;
    const current = []; for(let i=0; i<size*size; i++) current.push(craftingGrid[i]);
    let match = RECIPES.find(r => {
        if(r.grid === 3 && !isCraftingTable) return false;
        return JSON.stringify(r.in) === JSON.stringify(current.slice(0, r.in.length));
    });
    const resDiv = document.getElementById('crafting-result'); resDiv.innerHTML = '';
    if(match) {
        resDiv.innerHTML = `<img src="${ITEMS[match.out.id].texture}"><span class="count">${match.out.count}</span>`;
        resDiv.onclick = () => {
            addToInventory(match.out.id, match.out.count);
            for(let i=0; i<size*size; i++) craftingGrid[i] = null;
            renderInventoryUI(); renderHotbar();
        };
    }
}

function addToInventory(id, count) {
    let slot = inventory.find(s => s.id === id) || inventory.find(s => !s.id);
    if(slot) { slot.id = id; slot.count += count; }
}

function clearCraftingGrid() {
    for(let i=0; i<9; i++) { if(craftingGrid[i]) { addToInventory(craftingGrid[i], 1); craftingGrid[i] = null; } }
}

/**
 * 7. PHYSICS & GAME LOOP
 */
const raycaster = new THREE.Raycaster();
const clock = new THREE.Clock();

function checkCollision(pos) {
    const px = Math.round(pos.x), py = Math.round(pos.y), pz = Math.round(pos.z);
    for(let x=px-1; x<=px+1; x++) for(let y=py-2; y<=py+1; y++) for(let z=pz-1; z<=pz+1; z++) {
        if(world[`${x},${y},${z}`]) {
            const bx = x, by = y, bz = z;
            if(pos.x+0.3 > bx-0.5 && pos.x-0.3 < bx+0.5 && pos.y+0.2 > by-0.5 && pos.y-1.6 < by+0.5 && pos.z+0.3 > bz-0.5 && pos.z-0.3 < bz+0.5) return true;
        }
    }
    return false;
}

function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(type === 'break' ? 100 : type === 'hit' ? 80 : 300, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    
    if(!inventoryOpen) {
        // Gravity
        player.vel.y -= 25 * dt;

        // Input Movement
        const yaw = camera.rotation.y;
        const front = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const move = new THREE.Vector3();
        
        if(keys['KeyW']) move.add(front);
        if(keys['KeyS']) move.sub(front);
        if(keys['KeyA']) move.sub(right);
        if(keys['KeyD']) move.add(right);
        
        if(move.length() > 0) move.normalize().multiplyScalar(6);
        player.vel.x = move.x;
        player.vel.z = move.z;

        // Jump
        if(keys['Space'] && player.onGround) {
            player.vel.y = 8.5;
            player.onGround = false;
        }

        // Apply X-Z Movement
        player.pos.x += player.vel.x * dt;
        if(checkCollision(player.pos)) player.pos.x -= player.vel.x * dt;
        player.pos.z += player.vel.z * dt;
        if(checkCollision(player.pos)) player.pos.z -= player.vel.z * dt;

        // Apply Y Movement & Fall Damage
        player.lastYVel = player.vel.y;
        player.pos.y += player.vel.y * dt;
        if(checkCollision(player.pos)) {
            player.pos.y -= player.vel.y * dt;
            // Fall damage: triggered if downward velocity was high enough on impact
            if(player.vel.y < -12) {
                const dmg = Math.floor((Math.abs(player.vel.y) - 12) / 2);
                takeDamage(dmg);
            }
            player.vel.y = 0;
            player.onGround = true;
        } else {
            player.onGround = false;
        }

        camera.position.set(player.pos.x, player.pos.y, player.pos.z);
        if(player.invincible > 0) player.invincible -= dt;
    }

    // Mining Logic
    if(miningBlock) {
        const id = world[miningBlock.name];
        const data = ITEMS[id];
        let speed = 1.0;
        const held = inventory[selectedSlot];
        if(held && held.id && ITEMS[held.id].toolType === data.tool) speed = ITEMS[held.id].efficiency || 1.0;
        
        miningProgress += (dt / (data.hardness || 1)) * speed;
        document.getElementById('mining-progress-bar').style.width = Math.min(100, (miningProgress * 100)) + '%';
        
        if(miningProgress >= 1.0) {
            const dropId = data.drop || id;
            spawnItemDrop(miningBlock.position.x, miningBlock.position.y, miningBlock.position.z, dropId);
            setBlock(miningBlock.position.x, miningBlock.position.y, miningBlock.position.z, BLOCK.AIR);
            miningBlock = null;
            document.getElementById('mining-progress-container').style.display = 'none';
            playSound('break');
        }
    }

    // Drops Physics & Pickup
    for(let i = droppedItems.length - 1; i >= 0; i--) {
        const drop = droppedItems[i];
        drop.vel.y -= 20 * dt;
        drop.mesh.position.addScaledVector(drop.vel, dt);
        drop.mesh.rotation.y += 2 * dt;
        
        // Ground collision for drops
        const groundY = -4.5; // simple floor
        if(drop.mesh.position.y < groundY) {
            drop.mesh.position.y = groundY;
            drop.vel.set(0,0,0);
        }
        
        // Pickup check
        if(drop.mesh.position.distanceTo(player.pos) < 1.5) {
            addToInventory(drop.id, 1);
            scene.remove(drop.mesh);
            droppedItems.splice(i, 1);
            renderHotbar();
        }
    }

    mobs.forEach(m => m.update(dt));
    renderer.render(scene, camera);
}

const raycaster_sel = new THREE.Raycaster();
const selectionBox = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02, 1.02, 1.02)), new THREE.LineBasicMaterial({ color: 0x000000 }));
scene.add(selectionBox);

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body) {
        camera.rotation.y -= e.movementX * 0.002;
        camera.rotation.x -= e.movementY * 0.002;
        camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
    }
    raycaster_sel.setFromCamera(new THREE.Vector2(0,0), camera);
    const intersects = raycaster_sel.intersectObjects(interactables);
    if(intersects.length > 0 && intersects[0].distance < 5) {
        selectionBox.visible = true; selectionBox.position.copy(intersects[0].object.position);
    } else selectionBox.visible = false;
});

window.addEventListener('resize', () => { 
    camera.aspect = window.innerWidth/window.innerHeight; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(window.innerWidth, window.innerHeight); 
});

renderHotbar(); 
animate();
</script>
</body>
