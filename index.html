<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Clone - Canvas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M9 0h2v20H9zM0 9h20v2H0z" fill="rgba(255,255,255,0.8)"/></svg>') no-repeat center;
            transform: translate(-50%, -50%); pointer-events: none; mix-blend-mode: difference; z-index: 10;
        }
        #ui-container { position: absolute; bottom: 0; width: 100%; pointer-events: none; }
        #hotbar {
            display: flex; justify-content: center; background: rgba(0,0,0,0.5); padding: 5px; gap: 5px;
            pointer-events: auto; width: fit-content; margin: 0 auto 10px auto; border-radius: 5px;
        }
        .slot {
            width: 40px; height: 40px; background: rgba(100,100,100,0.8); border: 2px solid #333;
            display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative;
        }
        .slot.active { border-color: white; box-shadow: 0 0 5px white; }
        .slot img { width: 32px; height: 32px; image-rendering: pixelated; }
        .count { position: absolute; bottom: 2px; right: 2px; color: white; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 0 #000; }
        
        #inventory-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 20; justify-content: center; align-items: center;
            flex-direction: column; color: white;
        }
        #inventory-window {
            background: #c6c6c6; padding: 20px; border: 4px solid #555; color: #333;
            display: flex; gap: 20px; image-rendering: pixelated;
        }
        .grid-container { display: grid; gap: 4px; background: #8b8b8b; padding: 4px; border: 2px solid #fff; border-right-color: #373737; border-bottom-color: #373737; }
        .crafting-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .crafting-arrow { font-size: 24px; font-weight: bold; color: #333; }
        .inv-row { display: flex; gap: 4px; }
        
        #debug { position: absolute; top: 10px; left: 10px; color: white; font-weight: bold; text-shadow: 1px 1px 0 #000; pointer-events: none; }
        
        /* Tooltip */
        .tooltip { position: absolute; background: #111; color: #fff; padding: 4px 8px; border: 1px solid #fff; pointer-events: none; font-size: 12px; z-index: 100; display: none; }
    </style>
</head>
<body>

<div id="debug">Minecraft JS<br>WASD to Move, Space to Jump<br>Click to Mine/Place<br>'E' for Inventory</div>
<div id="crosshair"></div>

<!-- Inventory UI -->
<div id="inventory-screen">
    <h2>Inventory & Crafting</h2>
    <div id="inventory-window">
        <!-- Player Inventory -->
        <div>
            <h3>Backpack</h3>
            <div id="main-inventory" class="grid-container" style="grid-template-columns: repeat(9, 1fr);">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Crafting Area -->
        <div class="crafting-section">
            <h3 id="crafting-title">Crafting (2x2)</h3>
            <div id="crafting-grid" class="grid-container" style="grid-template-columns: repeat(2, 1fr);">
                <!-- Generated by JS -->
            </div>
            <div class="crafting-arrow">➜</div>
            <div id="crafting-result" class="slot" style="background: #8b8b8b;"></div>
        </div>
    </div>
    <div style="margin-top: 20px; color: #ccc;">Press 'E' to Close</div>
</div>

<div id="ui-container">
    <div id="hotbar"></div>
</div>

<div id="tooltip" class="tooltip"></div>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/**
 * 1. TEXTURE GENERATOR
 * Generates Minecraft-style block textures procedurally on canvas to avoid external assets.
 */
const TextureGen = {
    cache: {},
    create(name, color, noiseAlpha = 0.1, details = []) {
        if (this.cache[name]) return this.cache[name];
        
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        
        // Base color
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 64, 64);
        
        // Noise
        for(let i=0; i<400; i++) {
            ctx.fillStyle = `rgba(0,0,0,${Math.random() * noiseAlpha})`;
            ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
            ctx.fillStyle = `rgba(255,255,255,${Math.random() * noiseAlpha})`;
            ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
        }

        // Specific details
        details.forEach(d => {
            ctx.fillStyle = d.color;
            if(d.type === 'border') ctx.strokeRect(0,0,64,64);
            if(d.type === 'noise') { /* handled above */ }
            if(d.type === 'rect') ctx.fillRect(d.x, d.y, d.w, d.h);
            if(d.type === 'spots') {
                for(let i=0; i<d.count; i++) ctx.fillRect(Math.random()*60, Math.random()*60, d.s, d.s);
            }
        });

        const url = canvas.toDataURL();
        this.cache[name] = url;
        return url;
    }
};

// Generate Textures
const TEX = {
    grass_top: TextureGen.create('grass_top', '#5cb85c', 0.1, [{type:'spots', count:50, s:2, color:'#4cae4c'}]),
    grass_side: TextureGen.create('grass_side', '#795548', 0.1, [{type:'rect', x:0, y:0, w:64, h:20, color:'#5cb85c'}]),
    dirt: TextureGen.create('dirt', '#795548', 0.15),
    stone: TextureGen.create('stone', '#757575', 0.1),
    wood: TextureGen.create('wood', '#5d4037', 0.1, [{type:'rect', x:10, y:0, w:10, h:64, color:'#4e342e'}, {type:'rect', x:40, y:0, w:10, h:64, color:'#4e342e'}]),
    leaves: TextureGen.create('leaves', '#388e3c', 0.2, [{type:'spots', count:100, s:4, color:'#2e7d32'}]),
    plank: TextureGen.create('plank', '#a1887f', 0.05, [{type:'rect', x:0, y:0, w:64, h:2, color:'#5d4037'}, {type:'rect', x:0, y:32, w:64, h:2, color:'#5d4037'}]),
    cobblestone: TextureGen.create('cobblestone', '#616161', 0.2, [{type:'rect', x:10, y:10, w:20, h:20, color:'#757575'}, {type:'rect', x:35, y:35, w:15, h:15, color:'#757575'}]),
    crafting_table_side: TextureGen.create('crafting_side', '#5d4037', 0.05, [{type:'rect', x:5, y:5, w:54, h:54, color:'#8d6e63'}]),
    crafting_table_top: TextureGen.create('crafting_top', '#a1887f', 0.05, [{type:'rect', x:10, y:10, w:44, h:44, color:'#5d4037'}]),
    pig: TextureGen.create('pig', '#f48fb1', 0.05),
    zombie: TextureGen.create('zombie', '#2e7d32', 0.1),
    bedrock: TextureGen.create('bedrock', '#212121', 0.3)
};

/**
 * 2. GAME CONSTANTS & DATA
 */
const BLOCK = {
    AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, WOOD: 4, LEAVES: 5, PLANKS: 6, COBBLE: 7, CRAFTING_TABLE: 8, BEDROCK: 99
};

const ITEMS = {
    [BLOCK.GRASS]: { name: "Grass Block", texture: TEX.grass_side, type: 'block' },
    [BLOCK.DIRT]: { name: "Dirt", texture: TEX.dirt, type: 'block' },
    [BLOCK.STONE]: { name: "Stone", texture: TEX.stone, type: 'block' },
    [BLOCK.WOOD]: { name: "Log", texture: TEX.wood, type: 'block' },
    [BLOCK.LEAVES]: { name: "Leaves", texture: TEX.leaves, type: 'block' },
    [BLOCK.PLANKS]: { name: "Planks", texture: TEX.plank, type: 'block' },
    [BLOCK.COBBLE]: { name: "Cobblestone", texture: TEX.cobblestone, type: 'block' },
    [BLOCK.CRAFTING_TABLE]: { name: "Crafting Table", texture: TEX.crafting_table_side, type: 'block' },
    [BLOCK.BEDROCK]: { name: "Bedrock", texture: TEX.bedrock, type: 'block' },
    100: { name: "Stick", texture: TextureGen.create('stick', '#8d6e63', 0, [{type:'rect', x:28, y:10, w:8, h:44, color:'#5d4037'}]), type: 'item' },
    101: { name: "Wooden Pickaxe", texture: TextureGen.create('wood_pick', 'rgba(0,0,0,0)', 0, [{type:'rect', x:30, y:30, w:6, h:30, color:'#8d6e63'}, {type:'rect', x:10, y:20, w:44, h:10, color:'#a1887f'}]), type: 'tool' },
};

// Crafting Recipes
const RECIPES = [
    { in: [BLOCK.WOOD], out: { id: BLOCK.PLANKS, count: 4 } },
    { in: [BLOCK.PLANKS, BLOCK.PLANKS], out: { id: 100, count: 4 }, shape: 'vertical' }, // 2 planks vertical = sticks
    { in: [BLOCK.PLANKS, BLOCK.PLANKS, BLOCK.PLANKS, BLOCK.PLANKS], out: { id: BLOCK.CRAFTING_TABLE, count: 1 } },
    { in: [BLOCK.PLANKS, BLOCK.PLANKS, BLOCK.PLANKS, null, 100, null, null, 100, null], out: { id: 101, count: 1 }, grid: 3 } // Pickaxe
];

/**
 * 3. ENGINE SETUP
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ'; // Forces FPS-style rotation (Yaw then Pitch) to prevent rolling
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(50, 100, 50);
dirLight.castShadow = true;
scene.add(dirLight);

// Materials
const loader = new THREE.TextureLoader();
const matCache = {};
function getMat(id) {
    if(matCache[id]) return matCache[id];
    let texs = [];
    
    // Helper to load tex
    const l = (url) => { 
        const t = loader.load(url); 
        t.magFilter = THREE.NearestFilter; 
        return t; 
    };

    if(id === BLOCK.GRASS) {
        texs = [l(TEX.grass_side), l(TEX.grass_side), l(TEX.grass_top), l(TEX.dirt), l(TEX.grass_side), l(TEX.grass_side)];
    } else if(id === BLOCK.WOOD) {
        const side = l(TEX.wood); const top = l(TEX.wood); // simplified
        texs = [side, side, top, top, side, side];
    } else if(id === BLOCK.CRAFTING_TABLE) {
        const side = l(TEX.crafting_table_side); const top = l(TEX.crafting_table_top);
        texs = [side, side, top, l(TEX.plank), side, side];
    } else {
        const t = l(ITEMS[id].texture);
        texs = [t,t,t,t,t,t];
    }
    
    const mat = texs.map(t => new THREE.MeshLambertMaterial({ map: t }));
    matCache[id] = mat;
    return mat;
}

// World Data
const worldSize = 48; // Keeping it small for single-file performance
const worldHeight = 32;
const world = {}; // "x,y,z": blockId

function getKey(x, y, z) { return `${x},${y},${z}`; }

// Meshes Container
const blockMeshes = []; 
const interactables = [];

function setBlock(x, y, z, id) {
    const key = getKey(x, y, z);
    
    // Remove existing
    if (world[key]) {
        const oldMesh = scene.getObjectByName(key);
        if (oldMesh) {
            scene.remove(oldMesh);
            interactables.splice(interactables.indexOf(oldMesh), 1);
        }
        delete world[key];
    }

    if (id === BLOCK.AIR) return;

    world[key] = id;
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mesh = new THREE.Mesh(geo, getMat(id));
    mesh.position.set(x, y, z);
    mesh.name = key;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    
    scene.add(mesh);
    interactables.push(mesh);
}

// World Generation
function generateWorld() {
    // Ground
    for(let x = -10; x < 10; x++) {
        for(let z = -10; z < 10; z++) {
            let h = Math.floor(Math.sin(x/5) * 2 + Math.cos(z/5) * 2) + 0;
            // Bedrock
            setBlock(x, -5, z, BLOCK.BEDROCK);
            // Stone/Dirt
            for(let y = -4; y < h; y++) {
                setBlock(x, y, z, (y < h-2) ? BLOCK.STONE : BLOCK.DIRT);
            }
            // Grass top
            setBlock(x, h, z, BLOCK.GRASS);

            // Trees
            if(x > -8 && x < 8 && z > -8 && z < 8 && Math.random() < 0.05) {
                const th = 3 + Math.floor(Math.random() * 2);
                for(let ty = 1; ty <= th; ty++) setBlock(x, h+ty, z, BLOCK.WOOD);
                // Leaves
                for(let lx = -1; lx <= 1; lx++) {
                    for(let lz = -1; lz <= 1; lz++) {
                        for(let ly = th; ly <= th+1; ly++) {
                             if(lx===0 && lz===0 && ly===th) continue;
                             setBlock(x+lx, h+ly, z+lz, BLOCK.LEAVES);
                        }
                    }
                }
            }
        }
    }
}
generateWorld();

/**
 * 4. MOBS
 */
const mobs = [];
const mobGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
const zombieMat = new THREE.MeshLambertMaterial({ map: loader.load(TEX.zombie) });
const pigMat = new THREE.MeshLambertMaterial({ map: loader.load(TEX.pig) });
zombieMat.map.magFilter = THREE.NearestFilter;
pigMat.map.magFilter = THREE.NearestFilter;

class Mob {
    constructor(type, x, y, z) {
        this.mesh = new THREE.Mesh(mobGeo, type === 'zombie' ? zombieMat : pigMat);
        this.mesh.position.set(x, y, z);
        this.mesh.castShadow = true;
        scene.add(this.mesh);
        this.vel = new THREE.Vector3(0,0,0);
        this.onGround = false;
        this.moveTimer = 0;
        this.type = type;
    }
    update(dt) {
        // Simple AI
        this.moveTimer -= dt;
        if(this.moveTimer <= 0) {
            this.moveTimer = 1 + Math.random() * 2;
            const angle = Math.random() * Math.PI * 2;
            this.vel.x = Math.cos(angle) * 2;
            this.vel.z = Math.sin(angle) * 2;
            if(Math.random() < 0.3) this.vel.y = 5; // Jump
        }

        // Gravity
        this.vel.y -= 15 * dt;

        // X Movement & Collision
        this.mesh.position.x += this.vel.x * dt;
        if(checkCollision(this.mesh.position)) this.mesh.position.x -= this.vel.x * dt;

        // Z Movement & Collision
        this.mesh.position.z += this.vel.z * dt;
        if(checkCollision(this.mesh.position)) this.mesh.position.z -= this.vel.z * dt;

        // Y Movement & Collision
        this.mesh.position.y += this.vel.y * dt;
        if(checkCollision(this.mesh.position)) {
            this.mesh.position.y -= this.vel.y * dt;
            this.vel.y = 0;
            this.onGround = true;
            // Friction
            this.vel.x *= 0.9;
            this.vel.z *= 0.9;
        } else {
            this.onGround = false;
        }
        
        // Boundaries
        if(this.mesh.position.y < -10) { this.mesh.position.y = 10; this.mesh.position.x = 0; this.mesh.position.z = 0; }
    }
}
// Spawn some mobs
for(let i=0; i<3; i++) mobs.push(new Mob('pig', i*2, 5, i*2));
mobs.push(new Mob('zombie', -3, 5, -3));


/**
 * 5. PHYSICS & PLAYER CONTROLS
 */
const player = {
    pos: new THREE.Vector3(0, 5, 0),
    vel: new THREE.Vector3(),
    speed: 5,
    onGround: false,
    height: 1.6,
    radius: 0.3
};
camera.position.copy(player.pos);

// AABB Collision Helper
function getBlockAABB(x, y, z) {
    return { min: {x: x-0.5, y: y-0.5, z: z-0.5}, max: {x: x+0.5, y: y+0.5, z: z+0.5} };
}

function checkCollision(pos, radius = 0.3, height = 0.8) {
    // Check surrounding integer coordinates
    const px = Math.floor(pos.x);
    const py = Math.floor(pos.y);
    const pz = Math.floor(pos.z);
    
    // Check a 3x3x3 volume around player
    for(let x = px-1; x <= px+1; x++) {
        for(let y = py-1; y <= py+2; y++) {
            for(let z = pz-1; z <= pz+1; z++) {
                if(world[getKey(x, y, z)]) {
                    // Box collision
                    // Simple Box-Box check
                    const b = getBlockAABB(x, y, z);
                    // Player box (approx)
                    const p = { 
                        min: {x: pos.x - radius, y: pos.y - height/2, z: pos.z - radius},
                        max: {x: pos.x + radius, y: pos.y + height/2, z: pos.z + radius}
                    };

                    if (p.max.x > b.min.x && p.min.x < b.max.x &&
                        p.max.y > b.min.y && p.min.y < b.max.y &&
                        p.max.z > b.min.z && p.min.z < b.max.z) {
                        return true;
                    }
                }
            }
        }
    }
    return false;
}

// Input Handling
const keys = {};
document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if(e.code === 'KeyE') toggleInventory();
    // Hotbar keys
    if(e.key >= '1' && e.key <= '9') selectHotbarSlot(parseInt(e.key)-1);
});
document.addEventListener('keyup', (e) => keys[e.code] = false);

// Pointer Lock
document.body.addEventListener('click', () => {
    if(!inventoryOpen) document.body.requestPointerLock();
});

const mouse = new THREE.Vector2();
document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body) {
        camera.rotation.y -= e.movementX * 0.002;
        camera.rotation.x -= e.movementY * 0.002;
        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
    }
    // Update tooltip mouse pos for inventory
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

/**
 * 6. RAYCASTING (Mining/Placing)
 */
const raycaster = new THREE.Raycaster();
const selectionBox = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01)),
    new THREE.LineBasicMaterial({ color: 0x000000 })
);
scene.add(selectionBox);
selectionBox.visible = false;

document.addEventListener('mousedown', (e) => {
    if (document.pointerLockElement !== document.body) return;
    if(inventoryOpen) return;

    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(interactables);

    if (intersects.length > 0 && intersects[0].distance < 6) {
        const hit = intersects[0];
        const bx = hit.object.position.x;
        const by = hit.object.position.y;
        const bz = hit.object.position.z;

        if (e.button === 0) { // Left Click: Mine
            if(world[getKey(bx,by,bz)] === BLOCK.BEDROCK) return;
            
            // Give item
            addToInventory(world[getKey(bx,by,bz)], 1);
            
            setBlock(bx, by, bz, BLOCK.AIR);
            playSound('break');
        } else if (e.button === 2) { // Right Click: Place
            // Determine place position based on face normal
            const nx = hit.face.normal.x;
            const ny = hit.face.normal.y;
            const nz = hit.face.normal.z;
            
            const px = Math.round(bx + nx);
            const py = Math.round(by + ny);
            const pz = Math.round(bz + nz);
            
            // Check if player is inside
            const pBox = { 
                min: {x: player.pos.x - 0.3, y: player.pos.y - 1.6, z: player.pos.z - 0.3},
                max: {x: player.pos.x + 0.3, y: player.pos.y + 0.2, z: player.pos.z + 0.3}
            };
            const bBox = getBlockAABB(px, py, pz);
            
            const collision = (pBox.max.x > bBox.min.x && pBox.min.x < bBox.max.x &&
                               pBox.max.y > bBox.min.y && pBox.min.y < bBox.max.y &&
                               pBox.max.z > bBox.min.z && pBox.min.z < bBox.max.z);

            if(!collision) {
                const held = inventory[selectedSlot];
                if(held && held.id && ITEMS[held.id].type === 'block') {
                    // Check crafting table interaction first
                    if(world[getKey(bx,by,bz)] === BLOCK.CRAFTING_TABLE && !keys['ShiftLeft']) {
                        openCraftingTable();
                        return;
                    }
                    
                    setBlock(px, py, pz, held.id);
                    removeFromInventory(selectedSlot, 1);
                    playSound('place');
                }
            }
        }
    }
});

/**
 * 7. INVENTORY SYSTEM
 */
const inventory = new Array(36).fill(null).map(() => ({ id: null, count: 0 }));
// Initial items
inventory[0] = { id: BLOCK.WOOD, count: 16 };
inventory[1] = { id: BLOCK.COBBLE, count: 32 };
inventory[2] = { id: BLOCK.CRAFTING_TABLE, count: 1 };

let selectedSlot = 0;
let inventoryOpen = false;
let isCraftingTable = false; // 3x3 mode

// Crafting Grid state
const craftingGrid = new Array(9).fill(null); // supports up to 3x3
let craftingResult = null;

function renderHotbar() {
    const el = document.getElementById('hotbar');
    el.innerHTML = '';
    for(let i=0; i<9; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot' + (i === selectedSlot ? ' active' : '');
        const item = inventory[i];
        if(item && item.count > 0) {
            slot.innerHTML = `<img src="${ITEMS[item.id].texture}"><span class="count">${item.count}</span>`;
        }
        el.appendChild(slot);
    }
}

function selectHotbarSlot(idx) {
    selectedSlot = idx;
    renderHotbar();
}

function addToInventory(id, count) {
    // Try stack
    for(let i=0; i<36; i++) {
        if(inventory[i].id === id) {
            inventory[i].count += count;
            renderHotbar();
            return;
        }
    }
    // New slot
    for(let i=0; i<36; i++) {
        if(inventory[i].count === 0) {
            inventory[i].id = id;
            inventory[i].count = count;
            renderHotbar();
            return;
        }
    }
}

function removeFromInventory(slotIdx, count) {
    if(inventory[slotIdx].count >= count) {
        inventory[slotIdx].count -= count;
        if(inventory[slotIdx].count === 0) inventory[slotIdx].id = null;
        renderHotbar();
    }
}

function toggleInventory() {
    inventoryOpen = !inventoryOpen;
    const scr = document.getElementById('inventory-screen');
    if(inventoryOpen) {
        document.exitPointerLock();
        scr.style.display = 'flex';
        isCraftingTable = false; // Reset to 2x2 default
        renderInventoryUI();
    } else {
        scr.style.display = 'none';
        document.body.requestPointerLock();
        // Return items from grid to inv
        clearCraftingGrid();
    }
}

function openCraftingTable() {
    inventoryOpen = true;
    document.exitPointerLock();
    const scr = document.getElementById('inventory-screen');
    scr.style.display = 'flex';
    isCraftingTable = true;
    renderInventoryUI();
}

function renderInventoryUI() {
    // Render Main Inv
    const mainInv = document.getElementById('main-inventory');
    mainInv.innerHTML = '';
    inventory.forEach((item, idx) => {
        const d = createSlotDiv(item, idx, 'inv');
        mainInv.appendChild(d);
    });

    // Render Crafting Grid
    const craftDiv = document.getElementById('crafting-grid');
    const title = document.getElementById('crafting-title');
    
    // Set grid size based on isCraftingTable
    const gridSize = isCraftingTable ? 3 : 2;
    craftDiv.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    title.innerText = isCraftingTable ? "Crafting Table (3x3)" : "Crafting (2x2)";

    craftDiv.innerHTML = '';
    for(let i=0; i < gridSize*gridSize; i++) {
        // Map 2x2 indices to internal 9-array if needed, but simpler to just use 0-3 for 2x2
        const d = createSlotDiv({ id: craftingGrid[i], count: craftingGrid[i] ? 1 : 0 }, i, 'craft');
        craftDiv.appendChild(d);
    }

    checkRecipe();
}

let heldItem = null; // Mouse cursor item

function createSlotDiv(item, idx, type) {
    const s = document.createElement('div');
    s.className = 'slot';
    if(item && item.count > 0 && item.id) {
        s.innerHTML = `<img src="${ITEMS[item.id].texture}"><span class="count">${item.count}</span>`;
    }
    
    s.onclick = () => {
        if(type === 'inv') {
            if(heldItem) {
                // Swap logic is complex, simpler: if empty, place 1
                // For this demo: simple selection moves.
                // Better: Click moves to Crafting if open?
                // Simplest: Click item -> becomes heldItem. Click again -> place.
            } else {
                // Move 1 unit to first empty crafting slot? No, let's build a simple Click-to-Move system.
                // Simpler for demo: Click inventory item -> fills first empty crafting slot.
                // Click crafting slot -> returns to inventory.
                if(item.count > 0) {
                    // Find empty craft slot
                    const limit = isCraftingTable ? 9 : 4;
                    for(let c=0; c<limit; c++) {
                        if(!craftingGrid[c]) {
                            craftingGrid[c] = item.id;
                            inventory[idx].count--;
                            if(inventory[idx].count === 0) inventory[idx].id = null;
                            break;
                        }
                    }
                    renderInventoryUI();
                }
            }
        } else if (type === 'craft') {
            if(craftingGrid[idx]) {
                addToInventory(craftingGrid[idx], 1);
                craftingGrid[idx] = null;
                renderInventoryUI();
            }
        }
    };
    return s;
}

// Crafting Logic
function checkRecipe() {
    const size = isCraftingTable ? 3 : 2;
    // Extract current grid IDs
    const current = [];
    for(let i=0; i<size*size; i++) current.push(craftingGrid[i]);

    let match = null;

    for(let r of RECIPES) {
        if(r.grid === 3 && !isCraftingTable) continue;
        
        // Exact Match Logic (Simplified)
        // 1. Check counts
        // 2. Check positions (shapeless vs shaped is hard, we do simple exact array match or single ingredient)
        
        // Single ingredient recipes (shapeless, anywhere)
        if(r.in.length === 1) {
            // Count items in grid
            const items = current.filter(x => x !== null);
            if(items.length === 1 && items[0] === r.in[0]) match = r;
        } 
        // 2x2 shaped
        else if (r.in.length === 4 && size === 2) {
             let good = true;
             for(let i=0; i<4; i++) {
                 if(r.in[i] !== current[i]) good = false;
             }
             if(good) match = r;
        }
        // 3x3
        else if (r.in.length === 9 && size === 3) {
            let good = true;
            for(let i=0; i<9; i++) {
                if(r.in[i] !== current[i]) good = false;
            }
            if(good) match = r;
        }
        // Vertical Stick Recipe (Special Case)
        else if (r.shape === 'vertical') {
             // Hardcoded for demo: Planks at 0 and 2 (2x2) or 1 and 4 (3x3)?
             // Let's stick to exact array definitions in RECIPES for simplicity.
             // Stick recipe defined as [PLANKS, PLANKS] for 2x2.
             // If grid is 2x2: indices 0, 2 is vertical? No, 0,1 is horiz, 0,2 is vert in 2x2? No, 0,1 top row.
             // 2x2 indices: 0 1
             //              2 3
             // Vertical stack: 0 and 2.
             if(size===2 && current[0] === BLOCK.PLANKS && current[2] === BLOCK.PLANKS && !current[1] && !current[3]) match = r;
        }
    }

    const resDiv = document.getElementById('crafting-result');
    resDiv.innerHTML = '';
    craftingResult = null;

    if(match) {
        const out = match.out;
        resDiv.innerHTML = `<img src="${ITEMS[out.id].texture}"><span class="count">${out.count}</span>`;
        resDiv.onclick = () => {
            addToInventory(out.id, out.count);
            // Consume ingredients
            for(let i=0; i<size*size; i++) {
                if(craftingGrid[i]) craftingGrid[i] = null; // Remove 1
                // Note: Real Minecraft reduces stack, here we just used 1 per slot logic for simplicity
            }
            renderInventoryUI();
        };
    } else {
        resDiv.onclick = null;
    }
}

function clearCraftingGrid() {
    for(let i=0; i<9; i++) {
        if(craftingGrid[i]) {
            addToInventory(craftingGrid[i], 1);
            craftingGrid[i] = null;
        }
    }
}

/**
 * 8. GAME LOOP
 */
const clock = new THREE.Clock();

function playSound(type) {
    // very basic synth
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    if(type === 'break') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
        osc.start(); osc.stop(ctx.currentTime + 0.05);
    }
}

function updatePhysics(dt) {
    // Gravity
    player.vel.y -= 25.0 * dt;

    // Input Movement
    const speed = 10.0;
    const direction = new THREE.Vector3();
    
    // Use Camera Yaw for reliable movement direction (ignores looking down/up)
    const yaw = camera.rotation.y;
    const front = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

    if(keys['KeyW'] || keys['ArrowUp']) direction.add(front);
    if(keys['KeyS'] || keys['ArrowDown']) direction.sub(front);
    if(keys['KeyA'] || keys['ArrowLeft']) direction.sub(right);
    if(keys['KeyD'] || keys['ArrowRight']) direction.add(right);

    if(direction.length() > 0) direction.normalize();

    player.vel.x = direction.x * speed;
    player.vel.z = direction.z * speed;

    if(keys['Space'] && player.onGround) {
        player.vel.y = 8;
        player.onGround = false;
    }

    // Apply X
    player.pos.x += player.vel.x * dt;
    if(checkCollision(player.pos)) {
        player.pos.x -= player.vel.x * dt;
        player.vel.x = 0;
    }

    // Apply Z
    player.pos.z += player.vel.z * dt;
    if(checkCollision(player.pos)) {
        player.pos.z -= player.vel.z * dt;
        player.vel.z = 0;
    }

    // Apply Y
    player.pos.y += player.vel.y * dt;
    if(checkCollision(player.pos)) {
        player.pos.y -= player.vel.y * dt;
        player.vel.y = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }

    // World Boundary Fallback
    if(player.pos.y < -20) {
        player.pos.set(0, 10, 0);
        player.vel.set(0, 0, 0);
    }

    camera.position.copy(player.pos);
    
    // Raycast Highlight
    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
    const intersects = raycaster.intersectObjects(interactables);
    if(intersects.length > 0 && intersects[0].distance < 6) {
        selectionBox.visible = true;
        selectionBox.position.copy(intersects[0].object.position);
    } else {
        selectionBox.visible = false;
    }
}

function animate() {
    requestAnimationFrame(animate);
    
    const dt = Math.min(clock.getDelta(), 0.1);
    
    if(!inventoryOpen) updatePhysics(dt);
    
    mobs.forEach(mob => mob.update(dt));
    
    renderer.render(scene, camera);
}

// Initial UI
renderHotbar();
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
